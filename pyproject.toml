[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "logs",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP",
]
ignore = [
    "E501",
    "UP035",
    "UP006",
    "UP015",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = false
warn_redundant_casts = true
explicit_package_bases = true
namespace_packages = true
disable_error_code = ["call-overload", "arg-type", "unused-ignore", "attr-defined"]
exclude = [
    "^tests/",
    "^logs/",
]

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "presidio_analyzer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "presidio_anonymizer.*"
ignore_missing_imports = true
